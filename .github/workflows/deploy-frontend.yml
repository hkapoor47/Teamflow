
name: Deploy Teamflow Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/teamflow_deploy
          chmod 600 ~/.ssh/teamflow_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Verify EC2 connection
        run: |
          ssh -i ~/.ssh/teamflow_deploy \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "whoami && test -d /var/www/teamflow"

      - name: Deploy frontend to Nginx directory
        run: |
          tar -czf - -C dist . | \
          ssh -i ~/.ssh/teamflow_deploy \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo tar -xzf - -C /var/www/teamflow"

      - name: Verify deployed frontend
        run: |
          ssh -i ~/.ssh/teamflow_deploy \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "test -s /var/www/teamflow/index.html && echo 'Frontend deployed successfully'"
