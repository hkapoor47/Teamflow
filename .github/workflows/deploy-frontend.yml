name: Deploy Teamflow Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/teamflow_deploy
          chmod 600 ~/.ssh/teamflow_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Create frontend directory
        run: |
          ssh -i ~/.ssh/teamflow_deploy \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ec2-user/frontend"

      - name: Deploy frontend to EC2
        run: |
          tar -czf - -C dist . | \
          ssh -i ~/.ssh/teamflow_deploy \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "tar -xzf - -C /home/ec2-user/frontend"
